[project]
name = "eval-hybrid-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.1",
    "fastapi>=0.141.1",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.14.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "qdrant-client>=1.19.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
    "torch>=2.14.0",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
eval = [
    "langchain-community<0.4",
    "langchain-openai>=1.6.2",
    "matplotlib>=3.11.2",
    "pillow>=12.3.0",
    "ragas>=0.3.1",
    "rapidfuzz>=3.14.6",
]

[tool.uv]
default-groups = ["dev", "eval"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
pythonpath = ["."]
