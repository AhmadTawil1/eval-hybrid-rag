services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333" # REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # the image has bash but no curl: ask /readyz over a raw TCP connection
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /readyz HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q 200"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # one-shot: downloads the dataset and builds both indexes; skips the slow embedding step if Qdrant is already filled
  ingest:
    build: .
    image: eval-hybrid-rag:latest
    command:
      - sh
      - -c
      - "test -f data/raw/corpus.json || python scripts/download_data.py; python -m app.ingest"
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - raw_data:/app/data/raw
      - processed_data:/app/data/processed
    depends_on:
      qdrant:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    image: eval-hybrid-rag:latest
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      QDRANT_URL: http://qdrant:6333
    volumes:
      - processed_data:/app/data/processed:ro
    depends_on:
      qdrant:
        condition: service_healthy
      ingest:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=8)"
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 90s

volumes:
  qdrant_storage:
  raw_data:
  processed_data:
